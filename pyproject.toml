[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadscout"
version = "0.1.0"
description = "AI agent that finds local businesses with fixable problems, audits them, scores them and drafts outreach."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6",
    "pydantic>=2",
    "jinja2>=3",
    "dnspython>=2.6",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
sheets = ["gspread>=6"]
dev = ["pytest>=8"]

[project.scripts]
leadscout = "leadscout.cli:app"

[tool.setuptools.packages.find]
include = ["leadscout*"]

[tool.setuptools.package-data]
"leadscout.reports" = ["templates/*.html"]
